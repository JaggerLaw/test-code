<!doctype html>
<html lang="en-nz" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="normalize.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Quicksand:500,700"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="border-container">
      <div class="border-group">
        <h1 class="border-title">Need a dog sitter?</h1>
        <p class="border-subtitle">
          Find a trusted sitter in your community to look after your dog when
          you're busy or away
        </p>
        <button class="border-button">Learn More</button>
      </div>
      <img class="border" src="assets/main-banner.png" />
      <img class="border-wave" src="assets/banner-wave.svg" alt="banner" />
    </div>
    <div class="service-section">
      <h1>Our Services</h1>
      <p>
        Local & trusted pet sitters will trat your fur baby like family. You'll
        have piece of mind with regular communication and premium insurance.
      </p>
    </div>

    <div class="card-container">
      <div></div>
    </div>
  </body>
</html>
